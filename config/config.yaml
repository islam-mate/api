app:
  debug: true
  mode: development
  name: Islam Mate API
  version: 1.0.0
cache:
  ttl: 3600
cors:
  allowed_headers:
  - '*'
  allowed_methods:
  - GET
  - POST
  - OPTIONS
  allowed_origins:
  - '*'
  enabled: true
database:
  path: data/islammate.db
  type: sqlite
debug: false
host: 127.0.0.1
ip_whitelist:
  allowed_ips:
  - 127.0.0.1
  - ::1
  block_message: Access denied.
  enabled: false
languages:
  default: en
  supported:
  - en
  - ar
logging:
  enabled: true
  format: text
  level: INFO
  log_file: logs/api.log
  retention: 7 days
  rotation: 10 MB
modules:
  adhan: true
  allah_names: true
  auth: true
  azkar: true
  dua: true
  hadith: true
  hijri: true
  islamic_events: true
  location: true
  prayer_times: true
  qibla: true
  quran: false
  ramadan: true
  sharaawi: true
  zakat: true
port: 8000
security:
  auth_enabled: false
  ip_whitelist: []
  rate_limit_default: 60/minute
  rate_limit_heavy: 10/minute
  rate_limit_strict: 30/minute
  rate_limiting: true
server:
  host: 0.0.0.0
  port: 8000
  reload: true
